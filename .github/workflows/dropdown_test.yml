name: DropDown Test

on:
  push:
    tags:
      - 'm*.*.*' 
  workflow_dispatch:
    inputs:
      image:
        type: choice
        description: Select image to promote
        options:
          - sshnpd
          - activate_sshnpd
          - sshnp_sshnpd
          - npt_sshnpd
          - sshnpd-slim
          - srvd

permissions: # added using https://github.com/step-security/secure-workflows
  contents: read

jobs:
  single:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Promote canary to latest
        run: |
          echo "Would bump: ${{ github.event.inputs.image }}"

  multi:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: sshnpd
          - name: activate_sshnpd
          - name: sshnp_sshnpd
          - name: npt_sshnpd
          - name: sshnpd-slim
          - name: srvd
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Promote canary to latest
        run: |
          echo "Would bump: ${{ matrix.name }}"
